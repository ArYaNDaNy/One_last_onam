<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for the Brass Lamp -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="30%" stop-color="#D6A43A"/>
      <stop offset="70%" stop-color="#9E6B15"/>
      <stop offset="100%" stop-color="#5E3D06"/>
    </linearGradient>
    
    <linearGradient id="gold-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#E5B242"/>
      <stop offset="100%" stop-color="#A8741A"/>
    </linearGradient>

    <radialGradient id="flame-outer" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFF7AD"/>
      <stop offset="25%" stop-color="#FF9E1B"/>
      <stop offset="65%" stop-color="#D6331D"/>
      <stop offset="100%" stop-color="#D6331D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="flame-inner" cx="50%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF485"/>
      <stop offset="100%" stop-color="#FF9416"/>
    </radialGradient>

    <radialGradient id="lamp-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF9E1B" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FF9E1B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF9E1B" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Flame Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes flickerFlame {
      0%, 100% { transform: rotate(-1deg) scale(1); }
      25% { transform: rotate(1.5deg) scale(1.02, 0.98); }
      50% { transform: rotate(-2deg) scale(0.98, 1.03); }
      75% { transform: rotate(1deg) scale(1.01, 0.99); }
    }
    .flame-glow {
      animation: pulseGlow 2.5s ease-in-out infinite;
      transform-origin: 100px 90px;
    }
    .flame-group {
      animation: flickerFlame 1.8s ease-in-out infinite;
      transform-origin: 100px 105px;
    }
  </style>

  <!-- Ambient Flame Glow -->
  <circle cx="100" cy="85" r="75" fill="url(#lamp-glow)" class="flame-glow"/>

  <!-- Flame Structure -->
  <g class="flame-group" filter="url(#glow)">
    <!-- Outer Flame -->
    <path d="M 100,20 C 120,55 130,75 125,95 C 120,112 108,120 100,120 C 92,120 80,112 75,95 C 70,75 80,55 100,20 Z" fill="url(#flame-outer)"/>
    <!-- Inner Intense Core -->
    <path d="M 100,45 C 112,68 116,80 113,95 C 110,107 105,112 100,112 C 95,112 90,107 87,95 C 84,80 88,68 100,45 Z" fill="url(#flame-inner)"/>
    <!-- Blue Flame Base -->
    <ellipse cx="100" cy="110" rx="10" ry="5" fill="#4A90E2" opacity="0.7"/>
  </g>

  <!-- Cotton Wick -->
  <path d="M 100,108 Q 98,118 95,125 L 105,125 Q 102,118 100,108 Z" fill="#2C1D11"/>

  <!-- Diya Body (Traditional Brass Oil Lamp) -->
  <!-- Base Bowl Back/Inner Lip -->
  <ellipse cx="100" cy="125" rx="65" ry="14" fill="#6B470D"/>
  <ellipse cx="100" cy="127" rx="60" ry="11" fill="#422903"/>
  <!-- Oil Pool -->
  <ellipse cx="100" cy="128" rx="56" ry="9" fill="#B5720A" opacity="0.85"/>
  <ellipse cx="100" cy="128" rx="30" ry="5" fill="#E09B13" opacity="0.6"/>

  <!-- Front Rim & Main Bowl Body -->
  <path d="M 35,125 C 35,160 60,175 100,175 C 140,175 165,160 165,125 C 165,138 140,148 100,148 C 60,148 35,138 35,125 Z" fill="url(#gold-grad)"/>

  <!-- Bowl Rim Highlight -->
  <path d="M 35,125 C 60,140 140,140 165,125 C 140,146 60,146 35,125 Z" fill="url(#gold-highlight)"/>

  <!-- Decorative Spout / Lip Contour -->
  <path d="M 90,122 C 95,119 105,119 110,122 C 115,127 85,127 90,122 Z" fill="#FFE58F"/>

  <!-- Ornate Pedestal / Base Stand -->
  <!-- Upper Stem Ring -->
  <ellipse cx="100" cy="173" rx="28" ry="6" fill="url(#gold-highlight)"/>
  <path d="M 75,173 L 78,185 L 122,185 L 125,173 Z" fill="url(#gold-grad)"/>

  <!-- Lower Base Stand -->
  <ellipse cx="100" cy="185" rx="24" ry="5" fill="#6B470D"/>
  <path d="M 72,185 C 72,210 50,215 42,222 C 40,224 40,227 160,227 C 160,224 158,224 158,222 C 150,215 128,210 128,185 Z" fill="url(#gold-grad)"/>

  <!-- Base Rim Highlight & Etchings -->
  <ellipse cx="100" cy="223" rx="58" ry="7" fill="url(#gold-highlight)"/>
  <ellipse cx="100" cy="226" rx="64" ry="6" fill="#422903"/>

  <!-- Decorative Engravings on Bowl -->
  <path d="M 65,150 Q 100,168 135,150" fill="none" stroke="#FFE58F" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
  <circle cx="100" cy="162" r="3" fill="#FFE58F"/>
  <circle cx="80" cy="158" r="2" fill="#FFE58F"/>
  <circle cx="120" cy="158" r="2" fill="#FFE58F"/>
</svg>
